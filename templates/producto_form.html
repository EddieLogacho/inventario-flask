{% extends "base.html" %}
{% block title %}{{ 'Nuevo producto' if not producto else 'Editar producto' }} | Inventario{% endblock %}

{% block content %}
<h1 class="h3 mb-3">{{ 'Nuevo producto' if not producto else 'Editar producto' }}</h1>

<form method="post" novalidate>
  <div class="mb-3">
    <label class="form-label">Nombre*</label>
    <input type="text" name="nombre" class="form-control" required
           value="{{ (form and form.get('nombre')) or (producto and producto.nombre) or '' }}">
  </div>

  <div class="mb-3">
    <label class="form-label">Descripción</label>
    <textarea name="descripcion" class="form-control" rows="3">{{ (form and form.get('descripcion')) or (producto and producto.descripcion) or '' }}</textarea>
  </div>

  <div class="row">
    <div class="col-md-6 mb-3">
      <label class="form-label">Precio*</label>
      <input type="number" step="0.01" min="0" name="precio" class="form-control" required
             value="{{ (form and form.get('precio')) or (producto and producto.precio) or '' }}">
    </div>
    <div class="col-md-6 mb-3">
      <label class="form-label">Stock*</label>
      <input type="number" min="0" name="stock" class="form-control" required
             value="{{ (form and form.get('stock')) or (producto and producto.stock) or '' }}">
    </div>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">
      {{ 'Crear' if not producto else 'Guardar cambios' }}
    </button>
    <a class="btn btn-secondary" href="{{ url_for('lista_productos') }}">Cancelar</a>
  </div>
</form>
{% endblock %}
