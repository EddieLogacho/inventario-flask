<form method="post" action="{{ url_for('crear_producto') }}">
  <label>Nombre</label>
  <input type="text" name="nombre" value="{{ (form.nombre if form else (producto.nombre if producto else '')) or '' }}" required>

  <label>Descripción</label>
  <textarea name="descripcion">{{ (form.descripcion if form else (producto.descripcion if producto else '')) or '' }}</textarea>

  <label>Precio</label>
  <input type="number" step="0.01" name="precio" value="{{ (form.precio if form else (producto.precio if producto else 0)) }}" required>

  <label>Stock</label>
  <input type="number" name="stock" value="{{ (form.stock if form else (producto.stock if producto else 0)) }}" required>

  <button type="submit">Guardar</button>
</form>
